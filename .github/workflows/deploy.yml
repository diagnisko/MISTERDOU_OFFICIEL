# Mise en ligne sur Cloudflare à chaque envoi sur master (ou à la main,
# onglet Actions > Déploiement Cloudflare > Run workflow).
#
# À régler une fois dans GitHub (Settings > Secrets and variables > Actions) :
#   Secrets   : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Variables : SITE_URL  (ex. https://misterdou-web.<sous-domaine>.workers.dev)
# Les secrets de l'API (base, clés, R2, PayTech…) se règlent dans Cloudflare,
# sur le Worker misterdou-api, jamais ici.
name: Déploiement Cloudflare

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  SITE_URL: ${{ vars.SITE_URL }}

jobs:
  api:
    name: API (Worker + Container)
    runs-on: ubuntu-latest
    steps:
      - name: Réglages présents
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Secret CLOUDFLARE_API_TOKEN manquant"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID manquant"; exit 1; }
          test -n "$SITE_URL" || { echo "::error::Variable SITE_URL manquante"; exit 1; }
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@misterdou/deploy-api..."
      # Docker est disponible sur le runner : Wrangler construit l'image de l'API.
      - name: Déployer l'API
        working-directory: deploy/api
        run: pnpm exec wrangler deploy --var "API_PUBLIC_URL:$SITE_URL" --var "WEB_ORIGIN:$SITE_URL"

  web:
    name: Site (Next.js via OpenNext)
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@misterdou/web..."
      - name: Construire le site
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm run cf:build
      - name: Déployer le site
        working-directory: apps/web
        run: pnpm run cf:deploy
